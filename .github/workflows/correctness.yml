name: Native HTTP client correctness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: luce-http-client
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-base
          path: luce-base
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python3 luce-base/tools/checkout_main.py luce-http-client luce
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Bootstrap without language source changes
        working-directory: luce-http-client
        run: python3 tools/bootstrap.py
      - name: All six compiler modes
        working-directory: luce-http-client
        run: python3 tests/run.py
      - name: Memory safety instrumentation
        working-directory: luce-http-client
        run: python3 tests/sanitize.py
