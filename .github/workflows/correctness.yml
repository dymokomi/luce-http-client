name: Native HTTP client correctness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: luce-http-client
      - name: Read pins
        id: pins
        shell: bash
        run: |
          echo "base=$(tr -d '\n' < luce-http-client/bootstrap/BASE)" >> "$GITHUB_OUTPUT"
          echo "luce=$(tr -d '\n' < luce-http-client/bootstrap/LUCE)" >> "$GITHUB_OUTPUT"
          echo "crypto=$(tr -d '\n' < luce-http-client/bootstrap/CRYPTO)" >> "$GITHUB_OUTPUT"
          echo "tls=$(tr -d '\n' < luce-http-client/bootstrap/TLS)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
      - name: Check out the pinned library packages
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          while read -r name revision; do
            [ -n "$name" ] || continue
            git init -q "$name"
            git -C "$name" fetch -q --depth 1 "https://github.com/dymokomi/$name.git" "$revision"
            git -C "$name" checkout -q --detach FETCH_HEAD
          done < luce-http-client/bootstrap/PACKAGES
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce
          ref: ${{ steps.pins.outputs.luce }}
          path: luce
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-crypto
          ref: ${{ steps.pins.outputs.crypto }}
          path: luce-crypto
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-tls
          ref: ${{ steps.pins.outputs.tls }}
          path: luce-tls
      - name: Bootstrap without language source changes
        working-directory: luce-http-client
        run: python3 tools/bootstrap.py
      - name: All six compiler modes
        working-directory: luce-http-client
        run: python3 tests/run.py
      - name: Memory safety instrumentation
        working-directory: luce-http-client
        run: python3 tests/sanitize.py
